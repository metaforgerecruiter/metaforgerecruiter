[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "email_extraction"
version = "1.0.0"
description = "Auto Email Extraction Pipeline for Recruiter Applications"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv>=1.0.0",
    "msal>=1.28.0",
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
    "reportlab>=4.0.0",
    "openai>=1.40.0",
    "pypdf>=4.0.0",
    "python-docx>=1.1.0",
    "pandas>=2.2.0",
    "openpyxl>=3.1.0",
    "pillow>=10.0.0",
    "pytesseract>=0.3.10",
    "pydantic>=2.0.0",
    "celery>=5.3.0",
    "redis>=5.0.0",
    "structlog>=24.0.0"

]
